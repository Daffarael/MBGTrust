name: mbgtrust
description: "MBGTrust: Platform Digital Berbasis AI untuk Mitigasi Food Waste pada Program Makan Bergizi Gratis BGN Republik Indonesia"

# Mencegah publikasi tidak sengaja ke pub.dev
publish_to: 'none'

# Versi dan Nomor Rilis Aplikasi MBGTrust Platform
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

# Dependensi Utama Aplikasi MBGTrust
dependencies:
  flutter:
    sdk: flutter

  # Ikon Antarmuka Material & Cupertino
  cupertino_icons: ^1.0.8

  # Manajemen State Terpusat & Reaktif (Riverpod)
  flutter_riverpod: ^2.6.1

  # Navigasi & Deklaratif Routing (GoRouter)
  go_router: ^17.4.0

  # Klien HTTP Berkinerja Tinggi untuk Integrasi API Backend (Dio)
  dio: ^5.11.0

  # Penyimpanan Kunci-Nilai Lokal (Shared Preferences)
  shared_preferences: ^2.5.5

  # Penyimpanan Terenkripsi untuk Token Akses & Kredensial Akses (Flutter Secure Storage)
  flutter_secure_storage: ^9.2.4

  # Visualisasi Data Grafik Nutrisi & Mitigasi Food Waste (FL Chart)
  fl_chart: ^1.2.0

  # Tipografi & Tata Letak Huruf Resmi Google Fonts
  google_fonts: ^8.2.1

  # Pengolah Aset Vektor SVG
  flutter_svg: ^2.3.0

  # Efek Animasi Memuat Layar (Shimmer Progress)
  shimmer: ^3.0.0

  # Efek Animasi Vektor Interaktif (Lottie)
  lottie: ^3.1.2

  # Komponen Navigasi Melayang dengan Animasi Liquid Curved (Curved Navigation Bar)
  curved_navigation_bar: ^1.0.6

# Dependensi Pengembang & Pengujian
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Aturan Analisis Kode & Tata Bahasa Dart/Flutter (Flutter Lints)
  flutter_lints: ^6.0.0

# Konfigurasi Aset & Desain Flutter
flutter:
  uses-material-design: true

  # Deklarasi Aset Gambar Resmi & Logo MBGTrust
  assets:
    - assets/images/
    - assets/images/logo_mbgtrust.png
